
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO ONLINE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;
  background:#111827;color:white;
  font-family:Arial,sans-serif;text-align:center
}
h1{font-size:38px;color:#facc15}
.box{
  background:#263449;padding:18px;
  border-radius:18px;margin:15px auto;
  max-width:650px
}
input{
  padding:13px;border-radius:10px;
  border:0;margin:5px;width:90%;max-width:300px
}
button{
  padding:12px 17px;border:0;
  border-radius:10px;background:#facc15;
  font-weight:bold;margin:5px;cursor:pointer
}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
#players{
  display:flex;justify-content:center;
  gap:8px;flex-wrap:wrap
}
.player{padding:9px;background:#111827;border-radius:10px}
.active{outline:2px solid #facc15}
#hand{
  display:flex;justify-content:center;
  gap:7px;flex-wrap:wrap;margin:20px 0
}
.card{
  width:62px;height:90px;
  border:3px solid white;border-radius:12px;
  color:white;font-size:22px;font-weight:bold;
  box-shadow:0 3px 6px #0008
}
.red{background:#dc2626}
.blue{background:#2563eb}
.green{background:#16a34a}
.yellow{background:#eab308;color:#111}
.wild{
  background:linear-gradient(135deg,
  red 25%,yellow 25% 50%,green 50% 75%,blue 75%)
}
#message{color:#fde68a;min-height:25px;font-weight:bold}
#notice{color:#fca5a5;margin:15px;white-space:pre-wrap}
</style>
</head>

<body>

<h1>🃏 UNO ONLINE</h1>

<div class="box" id="lobby">
  <h2>친구들과 UNO!</h2>
  <input id="nickname" placeholder="닉네임" maxlength="12">
  <br>
  <button onclick="createRoom()">방 만들기</button>
  <br>
  <input id="roomInput" placeholder="방 코드 6자리" maxlength="6">
  <button onclick="joinRoom()">방 참가</button>
  <p>최대 4명까지 플레이 가능!</p>
</div>

<div class="box hidden" id="game">
  <h2>방 코드: <span id="code"></span></h2>
  <button onclick="copyCode()">코드 복사</button>

  <div id="players"></div>
  <p id="message">친구를 기다리는 중...</p>

  <button id="start" onclick="startGame()" class="hidden">
    게임 시작
  </button>

  <div id="board" class="hidden">
    <h2>현재 카드</h2>
    <div id="top"></div>

    <h3>현재 색상: <span id="color"></span></h3>
    <h3 id="turn"></h3>
    <p>남은 카드: <span id="count"></span></p>

    <button onclick="drawCard()">카드 뽑기</button>
    <button onclick="callUno()">UNO!</button>

    <h2>내 카드</h2>
    <div id="hand"></div>
  </div>
</div>

<div id="notice"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";

// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyAS0KOvr431jLQ7Y7iezbvKuYA7myUMAV4",
  authDomain: "uno-online-6ba7e.firebaseapp.com",
  databaseURL: "https://uno-online-6ba7e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "uno-online-6ba7e",
  appId: "1:338941576329:web:ff7975624a59d35a1f3258"
};

let db = null;
let uid = null;
let room = null;
let roomRef = null;
let data = null;

const colors = ["red","blue","green","yellow"];

function notice(text){
  document.getElementById("notice").textContent = text;
}

function msg(text){
  document.getElementById("message").textContent = text;
}

// Firebase 연결
async function connect(){
  if(typeof firebase === "undefined"){
    throw new Error("Firebase 라이브러리를 불러오지 못했습니다.");
  }

  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }

  db = firebase.database();

  if(!firebase.auth().currentUser){
    await firebase.auth().signInAnonymously();
  }

  uid = firebase.auth().currentUser.uid;
}

// 닉네임
function nick(){
  return document.getElementById("nickname").value.trim() || "플레이어";
}

// 방 코드 생성
function makeRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";

  for(let i=0;i<6;i++){
    result += chars[Math.floor(Math.random()*chars.length)];
  }

  return result;
}

// 카드 섞기
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

// 카드 덱
function makeDeck(){
  let deck=[];

  for(const color of colors){
    deck.push({c:color,v:"0"});

    for(let n=1;n<=9;n++){
      for(let i=0;i<2;i++){
        deck.push({c:color,v:String(n)});
      }
    }

    for(const value of ["+2","SKIP","REV"]){
      for(let i=0;i<2;i++){
        deck.push({c:color,v:value});
      }
    }
  }

  for(let i=0;i<4;i++){
    deck.push({c:"wild",v:"WILD"});
    deck.push({c:"wild",v:"+4"});
  }

  return shuffle(deck);
}

// 방 만들기
async function createRoom(){
  try{
    notice("Firebase 연결 중...");

    await connect();

    room = makeRoomCode();
    roomRef = db.ref("rooms/"+room);

    await roomRef.set({
      host:uid,
      players:[{
        id:uid,
        name:nick()
      }],
      started:false
    });

    notice("");
    enter();

  }catch(error){
    notice("방 생성 실패!\n"+error.message);
    console.error(error);
  }
}

// 방 참가
async function joinRoom(){
  try{
    notice("방에 접속 중...");

    await connect();

    room = document.getElementById("roomInput")
      .value.trim().toUpperCase();

    if(room.length!==6){
      throw new Error("방 코드는 6자리로 입력해 주세요.");
    }

    roomRef=db.ref("rooms/"+room);

    const snapshot=await roomRef.once("value");
    const r=snapshot.val();

    if(!r){
      throw new Error("존재하지 않는 방입니다.");
    }

    if(r.started){
      throw new Error("이미 시작된 게임입니다.");
    }

    if(!r.players || r.players.length>=4){
      throw new Error("방이 가득 찼습니다.");
    }

    if(!r.players.some(p=>p.id===uid)){
      await roomRef.child("players").transaction(players=>{
        if(!players) return players;

        if(players.some(p=>p.id===uid)) return;

        if(players.length>=4) return;

        players.push({
          id:uid,
          name:nick()
        });

        return players;
      });
    }

    notice("");
    enter();

  }catch(error){
    notice("방 참가 실패!\n"+error.message);
    console.error(error);
  }
}

// 방 입장
function enter(){
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("code").textContent=room;

  roomRef.on("value",snapshot=>{
    data=snapshot.val();

    if(data){
      render();
    }else{
      msg("방이 종료되었습니다.");
    }
  },error=>{
    notice("데이터 읽기 오류: "+error.message);
  });
}

// 화면 업데이트
function render(){
  if(!data || !data.players) return;

  const players=data.players;

  document.getElementById("players").innerHTML=
    players.map((p,i)=>{
      const active=data.started && i===data.turn;
      const cards=data.started && data.hands
        ? " ("+(data.hands[p.id]||[]).length+"장)"
        : "";

      return `<div class="player ${active?'active':''}">
        ${escapeHTML(p.name)}${cards}
      </div>`;
    }).join("");

  const host=data.host===uid;

  document.getElementById("start")
    .classList.toggle("hidden",!host||data.started);

  document.getElementById("board")
    .classList.toggle("hidden",!data.started);

  if(!data.started){
    msg("친구를 기다리는 중...");
    return;
  }

  if(!data.hands || !data.discard || !data.deck){
    msg("게임 데이터를 불러오는 중...");
    return;
  }

  if(data.winner){
    const winner=players.find(p=>p.id===data.winner);
    msg((winner?winner.name:"플레이어")+" 승리! 🎉");
    return;
  }

  const me=players.findIndex(p=>p.id===uid);
  const current=players[data.turn];

  if(!current) return;

  const mine=data.hands[uid]||[];

  msg(current.id===uid
    ?"당신의 차례입니다!"
    :"친구의 차례입니다.");

  document.getElementById("turn").textContent=
    current.name+" 차례";

  document.getElementById("count").textContent=
    data.deck.length+"장";

  document.getElementById("color").textContent=
    data.color;

  document.getElementById("top").innerHTML=
    cardHTML(data.discard[data.discard.length-1]);

  document.getElementById("hand").innerHTML=
    mine.map((card,i)=>{
      const top=data.discard[data.discard.length-1];

      const playable=
        card.c==="wild" ||
        card.c===data.color ||
        card.v===top.v;

      return `<button class="card ${card.c}"
        ${me!==data.turn||!playable?'disabled':''}
        onclick="play(${i})">${card.v}</button>`;
    }).join("");
}

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function cardHTML(card){
  return `<button class="card ${card.c}" disabled>${card.v}</button>`;
}

// 게임 시작
async function startGame(){
  try{
    if(!data || data.host!==uid) return;

    if(data.players.length<2){
      msg("2명 이상 모여야 시작할 수 있어요.");
      return;
    }

    const deck=makeDeck();
    const hands={};

    data.players.forEach(player=>{
      hands[player.id]=deck.splice(0,7);
    });

    let first=deck.shift();

    while(first.c==="wild"){
      deck.push(first);
      first=deck.shift();
    }

    await roomRef.update({
      started:true,
      deck:deck,
      hands:hands,
      discard:[first],
      color:first.c,
      turn:0,
      direction:1,
      winner:null,
      uno:{}
    });

  }catch(error){
    notice("게임 시작 실패: "+error.message);
  }
}

// 다음 차례
function next(r,n=1){
  return (
    r.turn+r.direction*n+r.players.length*10
  )%r.players.length;
}

// 카드 뽑기
function take(r,id,n){
  for(let i=0;i<n;i++){
    if(!r.deck.length){
      const top=r.discard.pop();
      r.deck=shuffle(r.discard);
      r.discard=[top];
    }

    if(r.deck.length){
      r.hands[id].push(r.deck.pop());
    }
  }
}

// 카드 내기
async function play(index){
  try{
    if(!data || !data.hands || !data.hands[uid]) return;

    const selected=data.hands[uid][index];
    if(!selected) return;

    let chosen=selected.c;

    if(chosen==="wild"){
      chosen=prompt(
        "색깔을 영어로 입력하세요:\nred, blue, green, yellow"
      );

      if(!colors.includes(chosen)) return;
    }

    await roomRef.transaction(r=>{
      if(!r || !r.started || r.winner) return r;
      if(r.players[r.turn].id!==uid) return r;

      const hand=r.hands[uid];
      const card=hand[index];
      const top=r.discard[r.discard.length-1];

      if(!card) return r;

      if(!(
        card.c==="wild" ||
        card.c===r.color ||
        card.v===top.v
      )){
        return r;
      }

      hand.splice(index,1);
      r.discard.push(card);
      r.color=chosen;

      if(hand.length===0){
        r.winner=uid;
        return r;
      }

      let steps=1;
      const target=r.players[next(r)].id;

      if(card.v==="SKIP"){
        steps=2;
      }

      if(card.v==="REV"){
        r.direction*=-1;

        if(r.players.length===2){
          steps=2;
        }
      }

      if(card.v==="+2"){
        take(r,target,2);
        steps=2;
      }

      if(card.v==="+4"){
        take(r,target,4);
        steps=2;
      }

      r.turn=next(r,steps);

      return r;
    });

  }catch(error){
    notice("카드 내기 실패: "+error.message);
  }
}

// 카드 뽑기
async function drawCard(){
  try{
    await roomRef.transaction(r=>{
      if(!r || !r.started || r.winner) return r;
      if(r.players[r.turn].id!==uid) return r;

      take(r,uid,1);
      r.turn=next(r);

      return r;
    });
  }catch(error){
    notice("카드 뽑기 실패: "+error.message);
  }
}

// UNO 선언
async function callUno(){
  try{
    await roomRef.transaction(r=>{
      if(!r || !r.started || r.winner) return r;
      if(r.players[r.turn].id!==uid) return r;

      if(r.hands[uid].length===1){
        r.uno=r.uno||{};
        r.uno[uid]=true;
      }

      return r;
    });

    msg("UNO! 선언!");

  }catch(error){
    notice("UNO 선언 실패: "+error.message);
  }
}

// 코드 복사
async function copyCode(){
  try{
    await navigator.clipboard.writeText(room);
    msg("방 코드 복사 완료!");
  }catch(error){
    prompt("방 코드를 복사해 주세요:",room);
  }
}

// 예상하지 못한 오류 표시
window.onerror=function(message){
  notice("JavaScript 오류: "+message);
};

window.addEventListener("unhandledrejection",event=>{
  notice("처리되지 않은 오류: "+
    (event.reason?.message||event.reason));
});
</script>
